version: "3.9"

# ============================================================
# FintechDemo — Docker Compose
# Runs both the VULNERABLE (port 5000) and HARDENED (port 5001)
# versions side by side for comparison during the demo.
#
# FOR EDUCATIONAL USE ONLY. Do not expose these ports externally.
# ============================================================

services:

  # ── Vulnerable app ────────────────────────────────────────
  vulnerable:
    build:
      context: ./vulnerable
      dockerfile: Dockerfile
    container_name: fintech-vulnerable
    ports:
      - "5000:5000"
    volumes:
      - vuln-data:/app/data
      - ./logs:/app/logs
    environment:
      DB_PATH: /app/data/bank.db
      LOG_PATH: /app/logs/vulnerable.log
      PORT: "5000"
    networks:
      - fintech-lab
    restart: unless-stopped

  # ── Hardened app ──────────────────────────────────────────
  hardened:
    build:
      context: ./hardened
      dockerfile: Dockerfile
    container_name: fintech-hardened
    ports:
      - "5001:5001"
    volumes:
      - hard-data:/app/data
      - ./logs:/app/logs
    environment:
      DB_PATH: /app/data/bank.db
      LOG_PATH: /app/logs/hardened.log
      PORT: "5001"
      # SECRET_KEY must be a random 32+ char string
      # Generate one: python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: "a3f8c1e5b2d94067a1f3c8e5b2d94067a1f3c8e5b2d94067a1f3c8e5b2d940"
      HTTPS: "0"
    networks:
      - fintech-lab
    restart: unless-stopped

volumes:
  vuln-data:
  hard-data:

networks:
  fintech-lab:
    driver: bridge
    # internal: true   # Uncomment to make fully air-gapped (no internet from containers)
