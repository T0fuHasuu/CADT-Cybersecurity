<!--
  ================================================================
  WAZUH AGENT CONFIGURATION — CADT SOC LAB
  Includes: Suricata EVE JSON forwarding, FIM, Sysmon, Auth logs
  ================================================================
-->
<ossec_config>

  <!-- ============================================================
       GENERAL SETTINGS
       ============================================================ -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wpbs.com</smtp_server>
    <email_from>ossecm@example.com</email_from>
    <email_to>recipient@example.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <update_check>yes</update_check>
  </global>

  <!-- ============================================================
       SURICATA EVE JSON LOG FORWARDING
       Reads Suricata's EVE JSON output and forwards to Wazuh Manager
       ============================================================ -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- ============================================================
       LINUX SYSTEM LOGS
       ============================================================ -->

  <!-- Authentication logs — SSH brute force, sudo, su -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Syslog — cron jobs, system events -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Audit daemon — privilege escalation, syscalls -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Apache / Web server access logs -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>

  <!-- ============================================================
       WINDOWS EVENT LOGS (for Windows endpoint)
       ============================================================ -->

  <!-- Security channel — logon events, account management -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Security</location>
    <query>Event/System[EventID=4624 or EventID=4625 or EventID=4634 or EventID=4688 or EventID=4720 or EventID=4726]</query>
  </localfile>

  <!-- Sysmon — process creation, network connections, file creation -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Sysmon/Operational</location>
  </localfile>

  <!-- PowerShell script block logging -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <query>Event/System[EventID=4104 or EventID=4103 or EventID=400 or EventID=600]</query>
  </localfile>

  <!-- System channel -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>System</location>
  </localfile>

  <!-- Application channel -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Application</location>
  </localfile>

  <!-- ============================================================
       FILE INTEGRITY MONITORING (FIM)
       ============================================================ -->
  <syscheck>
    <disabled>no</disabled>

    <!-- Frequency: check every 12 hours (43200 seconds) -->
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Alert when new file is found -->
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- Linux critical system files — real-time monitoring -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>

    <!-- Web directories — detect web shells in real-time -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/var/www</directories>

    <!-- Cron directories — detect persistence mechanisms -->
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">/var/spool/cron</directories>

    <!-- Windows critical paths -->
    <directories check_all="yes" report_changes="yes" realtime="yes">C:\inetpub\wwwroot</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">C:\Windows\System32</directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">C:\Users\Public</directories>

    <!-- ======================================================
         EXCLUSIONS
         ====================================================== -->

    <!-- Ignore frequently changing log files -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/mnttab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
    <ignore>/var/log</ignore>
    <ignore>/var/run</ignore>
    <ignore>/var/tmp</ignore>
    <ignore type="sregex">.log$|.tmp$|.swp$</ignore>

  </syscheck>

  <!-- ============================================================
       ROOTKIT DETECTION
       ============================================================ -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- ============================================================
       ACTIVE RESPONSE
       ============================================================ -->

  <!-- Auto-block IPs with 10+ auth failures (SSH/RDP) -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100001,100100</rules_id>
    <timeout>600</timeout>
  </active-response>

</ossec_config>
